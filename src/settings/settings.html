<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="settingsTitle">CPAB</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/ui.css">
  <link rel="stylesheet" href="settings.css">
  <script type="module" src="settings.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <img class="logo" data-logo alt="" width="134" height="29">
      <nav id="nav" class="nav" data-label-key="navLabel">
        <a href="#blocking" data-t="sectionBlocking"></a>
        <a href="#protection" data-t="sectionProtection"></a>
        <a href="#paused" data-t="sectionPaused"></a>
        <a href="#blocked-sites" data-t="sectionBlockedSites"></a>
        <a href="#allowed" data-t="sectionAllowed"></a>
        <a href="#statistics" data-t="sectionStats"></a>
        <a href="#appearance" data-t="sectionAppearance"></a>
        <a href="#about" data-t="sectionAbout"></a>
        <a href="#sources" data-t="creditsHeading"></a>
        <a href="#changelog" data-t="sectionChangelog"></a>
      </nav>
    </aside>

    <main class="main">
      <h1 class="title" data-t="settings"></h1>

      <section id="blocking" class="section">
        <h2 data-t="sectionBlocking"></h2>
        <p class="intro" data-t="blockingIntro"></p>

        <div class="panel">
          <label class="row row-lead">
            <span class="row-text">
              <span class="row-title" id="master-title" data-t="master"></span>
              <span class="row-desc" id="master-desc" data-t="masterDesc"></span>
            </span>
            <input id="master" class="switch" type="checkbox" role="switch" aria-labelledby="master-title" aria-describedby="master-desc">
          </label>
          <p id="master-note" class="row-note small" hidden data-t="masterOffNote"></p>
        </div>

        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="ads-title" data-t="groupAds"></span>
              <span class="row-desc" id="ads-desc" data-t="groupAdsDesc"></span>
              <span class="row-meta" data-meta="ads"></span>
              <span class="row-problem small" data-problem="ads" hidden></span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-group="ads" aria-labelledby="ads-title" aria-describedby="ads-desc">
          </label>
          <button class="lists-toggle" type="button" data-opens-lists="ads" aria-expanded="false" aria-controls="ads-lists" aria-describedby="ads-title" hidden>
            <span data-t="listsShow"></span>
          </button>
          <div id="ads-lists" class="lists" data-lists="ads" hidden>
            <p class="lists-note small" data-lists-note="ads" hidden data-t="listsGroupOff"></p>
          </div>
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="trackers-title" data-t="groupTrackers"></span>
              <span class="row-desc" id="trackers-desc" data-t="groupTrackersDesc"></span>
              <span class="row-meta" data-meta="trackers"></span>
              <span class="row-problem small" data-problem="trackers" hidden></span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-group="trackers" aria-labelledby="trackers-title" aria-describedby="trackers-desc">
          </label>
          <button class="lists-toggle" type="button" data-opens-lists="trackers" aria-expanded="false" aria-controls="trackers-lists" aria-describedby="trackers-title" hidden>
            <span data-t="listsShow"></span>
          </button>
          <div id="trackers-lists" class="lists" data-lists="trackers" hidden>
            <p class="lists-note small" data-lists-note="trackers" hidden data-t="listsGroupOff"></p>
          </div>
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="popups-title" data-t="groupPopups"></span>
              <span class="row-desc" id="popups-desc" data-t="groupPopupsDesc"></span>
              <span class="row-meta" data-meta="popups"></span>
              <span class="row-problem small" data-problem="popups" hidden></span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-group="popups" aria-labelledby="popups-title" aria-describedby="popups-desc">
          </label>
          <button class="lists-toggle" type="button" data-opens-lists="popups" aria-expanded="false" aria-controls="popups-lists" aria-describedby="popups-title" hidden>
            <span data-t="listsShow"></span>
          </button>
          <div id="popups-lists" class="lists" data-lists="popups" data-lists-always hidden>
            <p class="lists-note small" data-lists-note="popups" hidden data-t="listsGroupOff"></p>
          </div>
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="widgets-title" data-t="groupWidgets"></span>
              <span class="row-desc" id="widgets-desc" data-t="groupWidgetsDesc"></span>
              <span class="row-meta" data-meta="widgets"></span>
              <span class="row-problem small" data-problem="widgets" hidden></span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-group="widgets" aria-labelledby="widgets-title" aria-describedby="widgets-desc">
          </label>
          <button class="lists-toggle" type="button" data-opens-lists="widgets" aria-expanded="false" aria-controls="widgets-lists" aria-describedby="widgets-title" hidden>
            <span data-t="listsShow"></span>
          </button>
          <div id="widgets-lists" class="lists" data-lists="widgets" hidden>
            <p class="lists-note small" data-lists-note="widgets" hidden data-t="listsGroupOff"></p>
          </div>
        </div>
      </section>

      <section id="protection" class="section">
        <h2 data-t="sectionProtection"></h2>
        <p class="intro" data-t="protectionIntro"></p>

        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="harmful-title" data-t="harmful"></span>
              <span class="row-desc" id="harmful-desc" data-t="harmfulDesc"></span>
              <span class="row-meta" data-meta="harmful"></span>
              <span class="row-problem small" data-problem="harmful" hidden></span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-group="harmful" aria-labelledby="harmful-title" aria-describedby="harmful-desc">
          </label>
          <button class="lists-toggle" type="button" data-opens-lists="harmful" aria-expanded="false" aria-controls="harmful-lists" aria-describedby="harmful-title" hidden>
            <span data-t="listsShow"></span>
          </button>
          <div id="harmful-lists" class="lists" data-lists="harmful" hidden>
            <p class="lists-note small" data-lists-note="harmful" hidden data-t="listsGroupOff"></p>
          </div>
        </div>

        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="dataleak-title" data-t="dataLeak"></span>
              <span class="row-desc" id="dataleak-desc" data-t="dataLeakDesc"></span>
              <span class="row-meta" id="dataleak-meta"></span>
            </span>
            <input id="dataleak" class="switch" type="checkbox" role="switch" aria-labelledby="dataleak-title" aria-describedby="dataleak-desc">
          </label>
        </div>

        <h3 class="subheading" data-t="adultHeading"></h3>
        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="adult-title" data-t="adult"></span>
              <span class="row-desc" id="adult-desc" data-t="adultDesc"></span>
              <span class="row-meta" data-meta="adult"></span>
              <span class="row-problem small" data-problem="adult" hidden></span>
            </span>
            <input class="switch" type="checkbox" role="switch" data-group="adult" aria-labelledby="adult-title" aria-describedby="adult-desc">
          </label>
          <button class="lists-toggle" type="button" data-opens-lists="adult" aria-expanded="false" aria-controls="adult-lists" aria-describedby="adult-title" hidden>
            <span data-t="listsShow"></span>
          </button>
          <div id="adult-lists" class="lists" data-lists="adult" data-lists-always hidden>
            <p class="lists-note small" data-lists-note="adult" hidden data-t="listsGroupOff"></p>
          </div>
        </div>
      </section>

      <section id="paused" class="section">
        <h2 data-t="sectionPaused"></h2>
        <p class="intro" data-t="pausedIntro"></p>

        <div class="panel">
          <form id="add-site" class="add" novalidate>
            <label class="add-label small" for="site-input" data-t="pausedAddLabel"></label>
            <div class="add-controls">
              <input id="site-input" class="field" type="text" dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="example.com" aria-describedby="site-error">
              <button class="button button-primary" type="submit" data-t="pausedAdd"></button>
            </div>
            <p id="site-error" class="error" role="alert" hidden></p>
          </form>

          <div class="search" hidden>
            <input id="paused-search" class="field" type="search" dir="ltr" autocomplete="off" spellcheck="false">
          </div>
          <ul id="paused-list" class="paused-list"></ul>
          <p id="paused-none" class="search-none muted" role="status" data-t="searchNoMatches" hidden></p>
          <div id="paused-more" class="search-footer" hidden>
            <p id="paused-count" class="small muted" role="status"></p>
            <button id="paused-show-more" class="button button-quiet" type="button" hidden></button>
          </div>
          <div id="paused-empty" class="empty">
            <p class="empty-title" data-t="pausedEmptyTitle"></p>
            <p class="small muted" data-t="pausedEmptyHint"></p>
          </div>
        </div>
      </section>

      <section id="blocked-sites" class="section">
        <h2 data-t="sectionBlockedSites"></h2>
        <p class="intro" data-t="blockedSitesIntro"></p>

        <div class="panel">
          <form id="add-blocked-site" class="add" novalidate>
            <label class="add-label small" for="blocked-site-input" data-t="pausedAddLabel"></label>
            <div class="add-controls">
              <input id="blocked-site-input" class="field" type="text" dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="example.com" aria-describedby="blocked-site-error">
              <button class="button button-primary" type="submit" data-t="pausedAdd"></button>
            </div>
            <p id="blocked-site-error" class="error" role="alert" hidden></p>
          </form>

          <div class="search" hidden>
            <input id="blocked-site-search" class="field" type="search" dir="ltr" autocomplete="off" spellcheck="false">
          </div>
          <ul id="blocked-site-list" class="paused-list"></ul>
          <p id="blocked-site-none" class="search-none muted" role="status" data-t="searchNoMatches" hidden></p>
          <div id="blocked-site-more" class="search-footer" hidden>
            <p id="blocked-site-count" class="small muted" role="status"></p>
            <button id="blocked-site-show-more" class="button button-quiet" type="button" hidden></button>
          </div>
          <div id="blocked-site-empty" class="empty">
            <p class="empty-title" data-t="blockedSitesEmptyTitle"></p>
            <p class="small muted" data-t="blockedSitesEmptyHint"></p>
          </div>
        </div>
      </section>

      <section id="allowed" class="section">
        <h2 data-t="sectionAllowed"></h2>
        <p class="intro" data-t="allowedIntro"></p>

        <div class="panel">
          <form id="add-allowed" class="add" novalidate>
            <label class="add-label small" for="allowed-input" data-t="allowedAddLabel"></label>
            <div class="add-controls">
              <input id="allowed-input" class="field" type="text" dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="example.com" aria-describedby="allowed-error">
              <button class="button button-primary" type="submit" data-t="pausedAdd"></button>
            </div>
            <p id="allowed-error" class="error" role="alert" hidden></p>
          </form>

          <div class="search" hidden>
            <input id="allowed-search" class="field" type="search" dir="ltr" autocomplete="off" spellcheck="false">
          </div>
          <ul id="allowed-list" class="paused-list"></ul>
          <p id="allowed-none" class="search-none muted" role="status" data-t="searchNoMatches" hidden></p>
          <div id="allowed-more" class="search-footer" hidden>
            <p id="allowed-count" class="small muted" role="status"></p>
            <button id="allowed-show-more" class="button button-quiet" type="button" hidden></button>
          </div>
          <div id="allowed-empty" class="empty">
            <p class="empty-title" data-t="allowedEmptyTitle"></p>
            <p class="small muted" data-t="allowedEmptyHint"></p>
          </div>
        </div>

        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="exceptions-title" data-t="recommendedExceptions"></span>
              <span class="row-desc" id="exceptions-desc" data-t="recommendedExceptionsDesc"></span>
            </span>
            <input id="recommended-exceptions" class="switch" type="checkbox" role="switch" aria-labelledby="exceptions-title" aria-describedby="exceptions-desc">
          </label>
          <div class="exceptions">
            <p class="small muted" id="exceptions-heading" data-t="recommendedExceptionsList"></p>
            <ul id="exceptions-list" class="exceptions-list" aria-labelledby="exceptions-heading"></ul>
          </div>
        </div>
      </section>

      <section id="statistics" class="section">
        <h2 data-t="sectionStats"></h2>
        <p class="intro" data-t="statsIntro"></p>

        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="stats-daily-title" data-t="statsDaily"></span>
              <span class="row-desc" id="stats-daily-desc" data-t="statsDailyDesc"></span>
            </span>
            <input id="stats-daily" class="switch" type="checkbox" role="switch" aria-labelledby="stats-daily-title" aria-describedby="stats-daily-desc">
          </label>
          <p id="stats-daily-note" class="row-note small" hidden data-t="statsDailyOff"></p>
          <div class="stats">
            <p class="small muted" id="stats-heading" data-t="statsBlockedHeading"></p>
            <dl class="stats-counts" aria-labelledby="stats-heading">
              <div><dt data-t="statsToday"></dt><dd id="stats-today"></dd></div>
              <div><dt data-t="statsYesterday"></dt><dd id="stats-yesterday"></dd></div>
              <div><dt data-t="statsLast7Days"></dt><dd id="stats-last-7-days"></dd></div>
              <div><dt data-t="statsLast30Days"></dt><dd id="stats-last-30-days"></dd></div>
            </dl>
          </div>
        </div>

        <div class="panel">
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="stats-top-title" data-t="statsTopSites"></span>
              <span class="row-desc" id="stats-top-desc" data-t="statsTopSitesDesc"></span>
            </span>
            <input id="stats-top" class="switch" type="checkbox" role="switch" aria-labelledby="stats-top-title" aria-describedby="stats-top-desc">
          </label>
          <ol id="stats-top-list" class="paused-list stats-top" aria-labelledby="stats-top-title" hidden></ol>
          <p id="stats-top-empty" class="empty small muted" data-t="statsTopEmpty" hidden></p>
        </div>

        <div class="stats-clear">
          <button id="stats-clear" class="button" type="button" data-t="statsClear"></button>
          <p id="stats-clear-status" class="small muted" role="status"></p>
        </div>
      </section>

      <section id="appearance" class="section">
        <h2 data-t="sectionAppearance"></h2>

        <div class="panel">
          <div class="row row-choice">
            <span class="row-text">
              <span class="row-title" id="language-title" data-t="language"></span>
              <span class="row-desc" data-t="languageHint"></span>
            </span>
            <div class="choice" role="radiogroup" aria-labelledby="language-title">
              <label><input type="radio" name="language" value="auto"><span data-t="languageAuto"></span></label>
              <label><input type="radio" name="language" value="en"><span lang="en" dir="ltr">English</span></label>
              <label><input type="radio" name="language" value="fa"><span lang="fa" dir="rtl">فارسی</span></label>
            </div>
          </div>
          <div class="row row-choice">
            <span class="row-text">
              <span class="row-title" id="theme-title" data-t="theme"></span>
            </span>
            <div class="choice" role="radiogroup" aria-labelledby="theme-title">
              <label><input type="radio" name="theme" value="dark"><span data-t="themeDark"></span></label>
              <label><input type="radio" name="theme" value="light"><span data-t="themeLight"></span></label>
            </div>
          </div>
          <label class="row">
            <span class="row-text">
              <span class="row-title" id="badge-title" data-t="badge"></span>
              <span class="row-desc" id="badge-desc" data-t="badgeDesc"></span>
            </span>
            <input id="badge" class="switch" type="checkbox" role="switch" aria-labelledby="badge-title" aria-describedby="badge-desc">
          </label>
        </div>
      </section>

      <section id="about" class="section">
        <h2 data-t="sectionAbout"></h2>

        <div class="brand-lines">
          <p class="tagline" data-t="tagline"></p>
          <p class="muted" data-t="motto"></p>
        </div>

        <div class="panel">
          <dl class="facts">
            <div>
              <dt data-t="aboutName"></dt>
              <dd>
                <p id="name-fa" data-t="productName" hidden></p>
                <bdi dir="ltr" data-t="fullName"></bdi>
              </dd>
            </div>
            <div>
              <dt data-t="aboutVersion"></dt>
              <dd><bdi dir="ltr" id="version"></bdi></dd>
            </div>
            <div>
              <dt data-t="aboutLinks"></dt>
              <dd>
                <p class="small"><a href="https://cyclone9.dev/cpab" target="_blank" rel="noopener"><bdi dir="ltr">https://cyclone9.dev/cpab</bdi></a></p>
                <p class="small"><a href="https://cpab.cyclone9.dev/" target="_blank" rel="noopener"><bdi dir="ltr">https://cpab.cyclone9.dev/</bdi></a></p>
                <p class="small"><a href="https://github.com/cyclone9/CPAB" target="_blank" rel="noopener"><bdi dir="ltr">https://github.com/cyclone9/CPAB</bdi></a></p>
                <p class="small"><a id="show-welcome" href="../welcome/welcome.html" target="_blank" data-t="welcomeShow"></a></p>
              </dd>
            </div>
            <div>
              <dt data-t="aboutBrowsers"></dt>
              <dd>
                <p data-t="aboutBrowsersChrome"></p>
                <p class="small muted" data-t="aboutBrowsersOther"></p>
                <p class="small muted" data-t="aboutBrowsersFirefox"></p>
              </dd>
            </div>
            <div>
              <dt data-t="aboutLicence"></dt>
              <dd>
                <bdi dir="ltr">GPL-3.0-or-later</bdi>
                <p class="small muted" data-t="noWarranty"></p>
              </dd>
            </div>
          </dl>
        </div>

      </section>

      <section id="sources" class="section">
        <h2 data-t="creditsHeading"></h2>
        <p class="intro" data-t="creditsIntro"></p>

        <div class="panel">
          <div class="credits-repo">
            <p class="credit-title"><a href="https://github.com/cyclone9/CPAB-Lists" target="_blank" rel="noopener" data-t="creditsRepo"></a></p>
            <p class="small muted" data-t="creditsRepoNote"></p>
            <p class="small"><bdi dir="ltr">https://github.com/cyclone9/CPAB-Lists</bdi></p>
          </div>
          <ul id="credits" class="credits"></ul>
          <div id="credits-empty" class="empty" hidden>
            <p class="small muted" data-t="creditsEmpty"></p>
          </div>
        </div>
      </section>

      <section id="changelog" class="section">
        <h2 data-t="sectionChangelog"></h2>
        <p class="intro" data-t="changelogIntro"></p>

        <div class="panel">
          <ol id="changelog-list" class="changelog"></ol>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
