<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-t="warningTitle">CPAB</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/ui.css">
  <link rel="stylesheet" href="warning.css">
  <script type="module" src="warning.js"></script>
</head>
<body>
  <main class="warning">
    <img class="logo" data-logo alt="" width="134" height="29">

    <div class="card">
      <p class="eyebrow" data-t="warningEyebrow"></p>
      <h1 class="heading" data-t="warningHeading"></h1>
      <p class="domain"><bdi dir="ltr" id="domain"></bdi></p>
      <p id="reason" class="reason"></p>
      <p id="note" class="small muted" data-t="warningNote"></p>

      <div class="actions">
        <button id="back" class="button button-primary" type="button" data-t="warningBack"></button>
        <button id="continue" class="button" type="button" data-t="warningContinue"></button>
      </div>
      <p id="error" class="error" role="alert" hidden data-t="warningContinueError"></p>
    </div>

    <details id="report" class="report" hidden>
      <summary data-t="warningReport"></summary>
      <div class="report-body">
        <p id="report-text-label" class="small muted" data-t="reportPreviewLabel"></p>
        <pre id="report-text" class="report-text" dir="ltr" aria-labelledby="report-text-label"></pre>
        <p id="report-note" class="small muted"></p>
        <div class="actions">
          <button id="report-open" class="button" type="button" data-t="reportOpen"></button>
          <button id="report-copy" class="button" type="button" data-t="reportCopy"></button>
        </div>
        <p id="report-status" class="small" role="status"></p>
      </div>
    </details>
  </main>
</body>
</html>
