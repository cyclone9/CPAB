<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title data-t="popupTitle">CPAB</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/ui.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="head">
    <img class="logo" data-logo alt="" width="102" height="22">
  </header>

  <main class="body">
    <section id="site" class="site" hidden>
      <div>
        <p class="eyebrow" data-t="thisSite"></p>
        <p class="domain"><bdi dir="ltr" id="domain"></bdi></p>
        <p id="state" class="state small" hidden></p>
        <p id="stays" class="small muted" hidden></p>
      </div>

      <div id="dataleak" class="dataleak" hidden>
        <div id="dataleak-hibp" hidden>
          <p id="dataleak-line" class="dataleak-line small"></p>
          <p class="small"><a id="dataleak-source" target="_blank" rel="noopener noreferrer"></a></p>
        </div>
        <div id="dataleak-leakfa" hidden>
          <p id="dataleak-leakfa-line" class="dataleak-line small"></p>
          <p class="small"><a id="dataleak-leakfa-source" target="_blank" rel="noopener noreferrer" data-t="leakfaSource"></a></p>
        </div>
        <div id="dataleak-cpab" hidden>
          <p id="dataleak-cpab-line" class="dataleak-line small"></p>
          <p class="small"><a id="dataleak-cpab-source" target="_blank" rel="noopener noreferrer"></a></p>
        </div>
      </div>

      <div class="count">
        <p class="count-line small">
          <span data-t="blockedLabel"></span>
          <span id="blocked"></span>
        </p>
        <ul id="blocked-groups" class="count-groups" hidden></ul>
      </div>

      <button id="pause" class="button" type="button"></button>
      <button id="report" class="button" type="button" data-t="reportButton" aria-expanded="false" aria-controls="report-panel"></button>

      <div id="report-panel" class="report" hidden>
        <fieldset class="report-kinds">
          <legend class="eyebrow" data-t="reportKindLegend"></legend>
          <label><input type="radio" name="report-kind" value="broken"><span data-t="reportKindBroken"></span></label>
          <label><input type="radio" name="report-kind" value="missed"><span data-t="reportKindMissed"></span></label>
        </fieldset>
        <p id="report-text-label" class="eyebrow" data-t="reportPreviewLabel"></p>
        <pre id="report-text" class="report-text" dir="ltr" tabindex="0" aria-labelledby="report-text-label"></pre>
        <p id="report-note" class="small muted"></p>
        <div class="report-actions">
          <button id="report-open" class="button button-primary" type="button" data-t="reportOpen"></button>
          <button id="report-copy" class="button" type="button" data-t="reportCopy"></button>
          <button id="report-cancel" class="button" type="button" data-t="reportCancel"></button>
        </div>
        <p id="report-status" class="small" role="status"></p>
      </div>

      <div id="reload-offer" class="offer" hidden>
        <p class="small" data-t="reloadPrompt"></p>
        <button id="reload" class="button button-primary" type="button" data-t="reload"></button>
      </div>
    </section>

    <section id="restricted" class="restricted" hidden>
      <h1 class="restricted-title" data-t="restrictedTitle"></h1>
      <p class="small muted" data-t="restrictedBody"></p>
    </section>

    <p id="new-version" class="new-version small" hidden><a id="new-version-link" href="../settings/settings.html#about"></a></p>

    <p id="error" class="error" role="alert" hidden data-t="saveError"></p>
  </main>

  <footer class="foot">
    <label class="master">
      <span class="master-label" id="master-label" data-t="master"></span>
      <input id="master" class="switch" type="checkbox" role="switch" aria-labelledby="master-label">
    </label>
    <button id="open-settings" class="button settings-button" type="button" data-t="settings"></button>
  </footer>
</body>
</html>
