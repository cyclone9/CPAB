<body>
  <!-- The shape of an ad on varzesh3.ir (2026-11-08): a box marked data-ad around a click link. -->

    <a rel="nofollow" target="_blank" href="https://biz.varzesh3.ir/events/click/16962">
      <img alt="" src="http://biz-cdn.varzesh3.ir/banners/v3-banner-probe.gif">
    </a>
  </div>
  <!-- A click link outside a data-ad box. -->
  <a id="ad-link" rel="nofollow" target="_blank" href="https://biz.varzesh3.ir/events/click/6375">ad</a>
  <!-- Real content that must stay. -->
  <a id="news" href="https://www.varzesh3.ir/news/1">news</a>
  <img id="news-img" alt="" src="http://news-cdn.varzesh3.ir/v3-news-probe.gif">
</body>
