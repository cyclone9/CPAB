# SPDX-License-Identifier: GPL-3.0-or-later
# Fetches the filter lists every day, converts and checks them, and publishes the signed list data on
# cpab.cyclone9.dev through GitHub Pages. A failed run deploys nothing, so the last good data stays up.
name: List data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The build from the committed snapshots is what ships; fresh lists are measured against it.
      - name: Build the shipped lists
        run: |
          npm run build
          cp dist/rules/summary.json "$RUNNER_TEMP/shipped-summary.json"

      - name: Fetch the lists
        run: npm run lists
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test
        run: npm test

      - name: Build with the fresh lists
        run: npm run build

      - name: Write the site
        run: node scripts/publish-data.js --out _site --baseline "$RUNNER_TEMP/shipped-summary.json"
        env:
          CPAB_DATA_SIGNING_KEY: ${{ secrets.CPAB_DATA_SIGNING_KEY }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
